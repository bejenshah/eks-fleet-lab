# WORKLOAD: website1 - nginx web server
#
# Synced to eks-spoke-01 by gitops/addons/website1/application.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: website1
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: website1
spec:
  replicas: 1 # spoke is a single t3.small node
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
        app.kubernetes.io/part-of: website1
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine # pin a version; bump it in Git to roll out an upgrade
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20

# ADDON: ExternalDNS
#
# Lives in the hub's argocd namespace (created by the fleet-addons Application).
# Cluster generator: one Application per registered cluster whose secret carries the
# label enable_external_dns=true.  Add the label -> addon deployed. Remove it -> addon removed.
#
# Cluster-specific values (region, hosted-zone domain) are read from the cluster secret
# ANNOTATIONS that Terraform wrote in spoke-01/40-register  (the gitops-bridge pattern).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-external-dns
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            enable_external_dns: "true"
        values:
          chartVersion: "1.22.0" # bump this in Git to roll an upgrade across the whole fleet
  template:
    metadata:
      name: 'external-dns-{{ .name }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io # removing the app also removes what it deployed
    spec:
      project: default
      source:
        repoURL: https://kubernetes-sigs.github.io/external-dns/
        chart: external-dns
        targetRevision: '{{ .values.chartVersion }}'
        helm:
          releaseName: external-dns
          valuesObject:
            provider:
              name: aws
            env:
              - name: AWS_DEFAULT_REGION
                value: '{{ .metadata.annotations.aws_region }}'
            serviceAccount:
              create: true
              name: external-dns # must match the Pod Identity association from spoke-01/30-addon-infra
            domainFilters:
              - '{{ .metadata.annotations.external_dns_domain_filter }}'
            txtOwnerId: '{{ .name }}'
            policy: sync
            sources:
              - service
            extraArgs:
              - --aws-zone-type=private
              - --publish-internal-services # lets a plain ClusterIP Service get a DNS record (no LB cost)
      destination:
        name: '{{ .name }}'
        namespace: external-dns
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
